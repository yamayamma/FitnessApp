name: CI

# Trigger on push to main and all pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Install SwiftLint
      run: |
        brew install swiftlint
        swiftlint version
    
    - name: Install SwiftFormat
      run: |
        brew install swiftformat
        swiftformat --version
    
    - name: Run SwiftLint
      run: |
        swiftlint lint --strict --reporter github-actions-logging
    
    - name: Check SwiftFormat
      run: |
        swiftformat --lint .

  test-ios:
    name: Test iOS App
    runs-on: macos-14
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Install xcpretty
      run: gem install xcpretty
    
    - name: List available simulators
      run: xcrun simctl list devices available
    
    - name: Build iOS App
      run: |
        set -o pipefail && xcodebuild clean build \
          -project FitnessApp.xcodeproj \
          -scheme FitnessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
    
    - name: Run iOS Unit Tests
      run: |
        set -o pipefail && xcodebuild test \
          -project FitnessApp.xcodeproj \
          -scheme FitnessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
          -only-testing:FitnessAppTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
    
    - name: Run iOS UI Tests
      run: |
        set -o pipefail && xcodebuild test \
          -project FitnessApp.xcodeproj \
          -scheme FitnessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
          -only-testing:FitnessAppUITests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty

  test-watchos:
    name: Test watchOS App
    runs-on: macos-14
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Install xcpretty
      run: gem install xcpretty
    
    - name: List available watch simulators
      run: xcrun simctl list devices available | grep Watch
    
    - name: Build watchOS App
      run: |
        set -o pipefail && xcodebuild clean build \
          -project FitnessApp.xcodeproj \
          -scheme "FitnessAppWatch Watch App" \
          -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=10.2' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
    
    - name: Run watchOS Unit Tests
      run: |
        set -o pipefail && xcodebuild test \
          -project FitnessApp.xcodeproj \
          -scheme "FitnessAppWatch Watch App" \
          -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=10.2' \
          -only-testing:"FitnessAppWatch Watch AppTests" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty

  # Summary job that requires all tests to pass
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-ios, test-watchos]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
           [ "${{ needs.test-ios.result }}" != "success" ] || \
           [ "${{ needs.test-watchos.result }}" != "success" ]; then
          echo "❌ Some tests failed"
          exit 1
        fi
        echo "✅ All tests passed!"
