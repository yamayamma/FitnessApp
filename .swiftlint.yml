# SwiftLint Configuration for FitnessApp
# https://realm.github.io/SwiftLint/

# Paths to include during linting
included:
  - FitnessApp
  - FitnessAppWatch Watch App
  - FitnessAppTests
  - FitnessAppUITests
  - FitnessAppWatch Watch AppTests
  - FitnessAppWatch Watch AppUITests

# Paths to exclude during linting
excluded:
  - Pods
  - .build
  - DerivedData
  - .swiftpm

# Rules to disable
disabled_rules:
  - trailing_whitespace # SwiftFormat handles this
  - line_length # Can be too restrictive for UI code

# Rules to enable
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

# Rule configurations
file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - i
    - j
    - k
    - x
    - y
    - z

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# Force cast and try are allowed in tests
force_cast: warning
force_try: warning

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "\\bprint\\("
    message: "Use proper logging instead of print()"
    severity: warning
